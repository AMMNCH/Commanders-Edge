name: Deploy to GitHub Pages

# Builds the app and publishes it to the gh-pages branch, which GitHub Pages
# serves at https://ammnch.github.io/Commanders-Edge/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (hash routing, relative paths for the /Commanders-Edge/ subpath)
        run: npx vite build
        env:
          VITE_HASH_ROUTER: '1'
      - name: Publish to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
